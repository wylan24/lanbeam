name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$3" .
          }
          build windows amd64 lanbeam-windows-amd64.exe
          build windows arm64 lanbeam-windows-arm64.exe
          build darwin  arm64 lanbeam-macos-arm64
          build darwin  amd64 lanbeam-macos-amd64
          build linux   amd64 lanbeam-linux-amd64
          build linux   arm64 lanbeam-linux-arm64
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "LanBeam $GITHUB_REF_NAME" --generate-notes
